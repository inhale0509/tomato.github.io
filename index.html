<title>OPIC 어시스턴트</title>
<style>

* { box-sizing: border-box; }
body {

  color: var(--text);

.card {

}

.eyebrow { color: var(--text-muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.title-lg { font-size: 26px; margin: 0 0 8px; }

.subtle { color: var(--text-muted); font-size: 13.5px; }

.field { margin-bottom: 22px; }
.field label.field-label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 8px; }
.field input[type="text"], .field input[type="date"] {

.opt-row { display: flex; flex-direction: column; gap: 8px; }
.opt {

.opt:hover { border-color: var(--accent-purple); }

.cat-block { margin-bottom: 26px; }

.opt.compact { padding: 9px 12px; font-size: 13.5px; }

.counter-bar {

  border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 16px;
}
.counter-bar .num { font-weight: 800; font-size: 18px; }
.counter-bar .num.ok { color: var(--good); }
.counter-bar .num.bad { color: var(--critical); }
.counter-bar .track { flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
.counter-bar .track .fill { height: 100%; background: var(--accent-pink); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px;
  border: 1px solid transparent; font-weight: 700; font-size: 14px;
}
.btn-primary { background: var(--accent-purple); color: #fff; }
.btn-primary:hover { background: var(--accent-purple-strong); }
.btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent-purple); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--border); background: transparent; }
.btn-danger { background: transparent; border-color: var(--border); color: var(--critical); }
.btn-danger:hover { border-color: var(--critical); background: var(--critical-wash); }

.row-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; }

.nav {

  flex-wrap: wrap;
}
.nav .brand { margin-bottom: 0; margin-right: auto; }
.nav-tab {
  padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--text-muted); border: 1px solid transparent;
}
.nav-tab.active { background: var(--accent-purple-wash); color: var(--accent-purple-strong); }
.nav-tab:hover:not(.active) { color: var(--text); }

.grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

.board-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 700px) { .board-cols { grid-template-columns: 1fr 1fr; } }
.board-col { background: var(--surface-alt); border-radius: 12px; padding: 12px; min-height: 120px; }
.board-col h5 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0 0 10px; display: flex; justify-content: space-between; }
.board-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  font-size: 12.5px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.board-card:hover { border-color: var(--accent-purple); }
.board-card .pct { font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
.stage-0 { border-left: 3px solid var(--border); }
.stage-1 { border-left: 3px solid var(--accent-yellow); }
.stage-2 { border-left: 3px solid var(--accent-pink); }
.stage-3 { border-left: 3px solid var(--good); }

.sched-wrap { overflow-x: auto; }
table.sched { width: 100%; border-collapse: collapse; font-size: 13px; }
table.sched th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
table.sched td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.sched tr.today { background: var(--accent-yellow-wash); }
table.sched tr.today td:first-child { border-radius: 8px 0 0 8px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; margin: 1px 3px 1px 0; }
.pill-new { background: var(--accent-purple-wash); color: var(--accent-purple-strong); }
.pill-review { background: var(--accent-pink-wash); color: var(--accent-pink-strong); }
.pill-restweek { background: var(--surface-alt); color: var(--text-muted); }

.today-panel { display: flex; flex-direction: column; gap: 14px; }
.q-topic { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--surface); }
.q-topic .topic-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.q-topic .rec { font-size: 11.5px; color: var(--accent-purple-strong); font-weight: 700; background: var(--accent-purple-wash); display: inline-block; padding: 1px 8px; border-radius: 999px; margin-bottom: 10px; }
.q-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.q-list li { font-size: 13.5px; padding: 9px 12px; border-radius: 8px; background: var(--surface-alt); display: flex; gap: 8px; }
.q-list li .qn { color: var(--text-muted); font-weight: 700; flex-shrink: 0; }
.q-list li.placeholder { color: var(--text-muted); font-style: italic; }
.review-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.review-card .rtype { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.rtype.day3 { background: var(--warning-wash); color: var(--warning); }
.rtype.day7 { background: var(--good-wash); color: var(--good); }

.empty-note { color: var(--text-muted); font-size: 13px; padding: 14px 16px; background: var(--surface-alt); border-radius: 10px; }

.filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px;
}
table.db { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.db th { text-align: left; padding: 8px 10px; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
table.db td { padding: 10px; border-bottom: 1px solid var(--border); }

.io-bar { display: flex; gap: 8px; }
.welcome-hero { text-align: center; padding: 90px 20px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.welcome-hero .msg { font-size: 22px; font-weight: 700; max-width: 480px; text-wrap: balance; }
</style>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "opicAssistantData";
  var API_BASE_URL = "https://opic-assistant.onrender.com";

  var PART1 = ["사업/회사", "재택근무/사업", "교사/교육자", "일 경험 없음"];
  var PART2_EDU = ["학위 과정", "전문 기술 학습", "어학 수업", "5년 이상 경과", "없음"];
  var PART3 = ["개인주택·아파트에 홀로 거주", "친구·룸메이트와 함께", "가족과 함께", "학교 기숙사", "군대 막사"];

  var HIGH_REC = ["카페/커피전문점 가기", "영화보기", "공원 가기", "음악 감상하기", "국내 여행", "해외여행", "쇼핑하기", "TV 시청하기", "독서", "요리하기", "산책", "걷기", "조깅", "SNS에 글 올리기"];
  var LOW_REC = ["크로켓", "미식축구", "하키", "아이스 스케이트", "태권도", "체스 하기", "주식 투자", "군대 막사"];

  var PART4 = {
    "여가활동": ["영화보기", "클럽/나이트클럽 가기", "박물관 가기", "공원 가기", "스포츠 관람", "주거 개선", "해변 가기", "요리 관련 프로그램 시청", "게임하기", "공연 보기", "SNS에 글 올리기", "캠핑 하기", "구직 활동하기", "술집/바에 가기", "당구 치기", "친구들과 문자 대화", "리얼리티 쇼 시청", "쇼핑하기", "TV 시청하기", "콘서트 보기", "체스 하기", "카페/커피전문점 가기", "뉴스를 보거나 듣기", "시험 대비 과정 수강", "차 드라이브 하기", "자원봉사"],
    "취미/관심사": ["아이에게 책 읽어주기", "독서", "글쓰기", "신문 읽기", "애완동물 키우기", "혼자 노래 부르거나 합창", "주식 투자", "악기 연주하기", "사진 촬영하기", "요리하기", "음악 감상하기", "그림 그리기", "춤추기", "여행 관련 잡지나 블로그 읽기"],
    "운동": ["농구", "야구/소프트볼", "축구", "미식축구", "하키", "크로켓", "골프", "배구", "테니스", "배드민턴", "탁구", "수영", "자전거", "스키/스노보드", "아이스 스케이트", "조깅", "걷기", "요가", "하이킹/트레킹", "낚시", "헬스", "태권도", "운동 수업 수강하기", "운동을 전혀 하지 않음"],
    "휴가/출장": ["국내 출장", "해외출장", "집에서 보내는 휴가", "국내 여행", "해외여행"]
  };
  var PART5_CANDIDATES = ["병원", "명절", "은행", "경찰", "식당", "호텔", "가구 구입", "날씨", "교통 수단", "가전제품"];
  var NO_EXERCISE = "운동을 전혀 하지 않음";
  var PART4_TARGET = 6;
  var PART5_TARGET = 4;
  var STAGES = ["학습 전", "스크립트 작성중", "복습중", "완료"];

  function defaultState() {
    return {
      profile: null,
      surveyAnswers: null,
      difficultyLevel: "5-6",
      welcomeMessage: null,
      topicQuestions: null,
      schedule: null,
      progressBoard: {},
      scripts: [],
      expressions: [],
      logs: []
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      for (var k in d) if (parsed[k] !== undefined) d[k] = parsed[k];
      return d;
    } catch (e) {
      return defaultState();
    }
  }

  var state = load();

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function parseISO(s) {
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  var WEEKDAY_KO = ["일", "월", "화", "수", "목", "금", "토"];

  function isWeekend(d) { var w = d.getDay(); return w === 0 || w === 6; }

  function weekdaysFrom(startDate, count) {
    var out = [];
    var d = new Date(startDate);
    while (out.length < count) {
      if (!isWeekend(d)) out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function addBusinessDays(date, n) {
    var d = new Date(date);
    var added = 0;
    while (added < n) {
      d.setDate(d.getDate() + 1);
      if (!isWeekend(d)) added++;
    }
    return d;
  }

  function addCalendarDays(date, n) {
    var d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function generateSchedule(topics, startDateStr) {
    var startDate = parseISO(startDateStr);
    var learnDays = weekdaysFrom(startDate, Math.ceil(topics.length / 2));
    var lastLearnDay = learnDays[learnDays.length - 1];
    var reviewOnlyDays = weekdaysFrom(addCalendarDays(lastLearnDay, 1), 5);

    var byDate = {};
    function ensure(dateStr) {
      if (!byDate[dateStr]) byDate[dateStr] = { newTopics: [], reviewTopics: [], restWeek: false };
      return byDate[dateStr];
    }

    learnDays.forEach(function (day, i) {
      var dateStr = fmtDate(day);
      var t1 = topics[i * 2], t2 = topics[i * 2 + 1];
      var entry = ensure(dateStr);
      if (t1) entry.newTopics.push(t1);
      if (t2) entry.newTopics.push(t2);

      [t1, t2].forEach(function (topic) {
        if (!topic) return;
        var d3 = fmtDate(addBusinessDays(day, 3));
        var d7 = fmtDate(addCalendarDays(day, 7));
        ensure(d3).reviewTopics.push({ topic: topic, type: "3day", learnedOn: dateStr });
        ensure(d7).reviewTopics.push({ topic: topic, type: "7day", learnedOn: dateStr });
      });
    });

    reviewOnlyDays.forEach(function (day) {
      ensure(fmtDate(day)).restWeek = true;
    });

    var allDays = learnDays.concat(reviewOnlyDays).map(fmtDate).sort();
    return {
      startDate: fmtDate(startDate),
      learnDays: learnDays.map(fmtDate),
      reviewOnlyDays: reviewOnlyDays.map(fmtDate),
      byDate: byDate,
      allDays: allDays,
      topics: topics
    };
  }

  // ① 주말 보충: 오늘의 미완료 신규 주제를 다가오는 주말로 옮긴다. 평일 스케줄은 그대로라 3주 목표가 유지된다.
  function extendScheduleByWeekendMakeup(schedule, todayStr) {
    var todayEntry = schedule.byDate[todayStr];
    var pendingTopics = (todayEntry && todayEntry.newTopics) || [];

    var d = parseISO(todayStr);
    d.setDate(d.getDate() + 1);
    while (!isWeekend(d)) d.setDate(d.getDate() + 1);
    var weekendStr = fmtDate(d);

    var newByDate = {};
    for (var key in schedule.byDate) newByDate[key] = schedule.byDate[key];
    var existing = newByDate[weekendStr];
    if (existing) {
      existing.newTopics = (existing.newTopics || []).concat(pendingTopics);
      existing.makeup = true;
    } else {
      newByDate[weekendStr] = { newTopics: pendingTopics.slice(), reviewTopics: [], restWeek: false, makeup: true };
    }

    var allDays = schedule.allDays.indexOf(weekendStr) === -1 ? schedule.allDays.concat([weekendStr]).sort() : schedule.allDays;

    return {
      startDate: schedule.startDate,
      learnDays: schedule.learnDays,
      reviewOnlyDays: schedule.reviewOnlyDays,
      byDate: newByDate,
      allDays: allDays,
      topics: schedule.topics
    };
  }

  // ② 목표일 연장: 오늘 이후 모든 날짜의 내용을 평일 한 칸씩 뒤로 민다(간격은 자동 보존). 3주 목표가 그만큼 늘어난다.
  function extendScheduleByPushingDeadline(schedule, todayStr) {
    var keepDates = schedule.allDays.filter(function (d) { return d <= todayStr; });
    var futureDates = schedule.allDays.filter(function (d) { return d > todayStr; }).sort();

    // 각 미래 날짜를 개별적으로 다음 평일로 민다 — "내일부터 새 시퀀스를 재계산"하면
    // 오늘과 첫 예정일 사이에 이미 빈 평일(주말 낀 간격)이 있을 때 그 틈으로 흡수되어
    // 실제로는 아무 날짜도 밀리지 않는 버그가 있었다(간격을 무시하고 처음부터 다시 채움).
    var oldToNew = {};
    futureDates.forEach(function (oldD) { oldToNew[oldD] = fmtDate(addBusinessDays(parseISO(oldD), 1)); });

    var newByDate = {};
    keepDates.forEach(function (d) { newByDate[d] = schedule.byDate[d]; });
    futureDates.forEach(function (oldD) { newByDate[oldToNew[oldD]] = schedule.byDate[oldD]; });

    function remap(d) { return oldToNew[d] || d; }
    var newAllDays = keepDates.concat(futureDates.map(remap)).sort();

    return {
      startDate: schedule.startDate,
      learnDays: schedule.learnDays.map(remap).sort(),
      reviewOnlyDays: schedule.reviewOnlyDays.map(remap).sort(),
      byDate: newByDate,
      allDays: newAllDays,
      topics: schedule.topics
    };
  }

      tabs.map(function (t) {
        return '<button class="nav-tab ' + (active === t[0] ? "active" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
      }).join("") +
      '<div class="io-bar"><button class="btn btn-ghost btn-sm" id="btn-export">내보내기</button>' +
      '<label class="btn btn-ghost btn-sm" style="margin:0;">가져오기<input type="file" id="f-import" accept="application/json" style="display:none" /></label>' +
      '<button class="btn btn-danger btn-sm" id="btn-reset">처음부터 다시 시작 (회원탈퇴)</button></div>' +
      "</div>" + confirmBanner;
  }

  function requestReset() {
    state._confirmingReset = true;
    render();
  }

  function cancelReset() {
    state._confirmingReset = false;
    render();
  }

  function confirmReset() {
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    render();
  }

  function bindNav() {
    Array.prototype.forEach.call(app.querySelectorAll(".nav-tab"), function (el) {
      el.addEventListener("click", function () {
        state.activeTab = el.getAttribute("data-tab");
        save(); render();
      });
    });
    document.getElementById("btn-export").addEventListener("click", doExport);
    document.getElementById("f-import").addEventListener("change", doImport);
    document.getElementById("btn-reset").addEventListener("click", requestReset);
    var cancelBtn = document.getElementById("btn-reset-cancel");
    if (cancelBtn) cancelBtn.addEventListener("click", cancelReset);
    var confirmBtn = document.getElementById("btn-reset-confirm");
    if (confirmBtn) confirmBtn.addEventListener("click", confirmReset);
  }

  function doExport() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "opic-data.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function doImport(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var d = defaultState();
        for (var k in d) if (parsed[k] !== undefined) d[k] = parsed[k];
        d.entered = parsed.entered; d.activeTab = parsed.activeTab;
        state = d;
        save();
        render();
      } catch (err) {
        alert("파일을 읽을 수 없습니다: " + err.message);
      }
    };
    reader.readAsText(file);
  }

  function buildSurveyPrompt() {
    var sa = state.surveyAnswers;
    var lines = [
      "[OPIC 설문 결과 — T0 입력]",
      "Part1 직업분야: " + sa.part1,
      "Part2 학생여부: " + sa.part2Student,
      "Part2 최근수강: " + sa.part2Edu,
      "Part3 거주형태: " + sa.part3,
      "Part4 일반주제(" + sa.part4.length + "): " + sa.part4.join(", "),
      "Part5 돌발주제(" + sa.part5.length + "): " + sa.part5.join(", "),
      "",
      "위 내용으로 T0를 실행해서 20개 학습 주제와 예시 질문 80개를 만들어줘."
    ];
    return lines.join("\n");
  }

  function copySurveyPrompt() {
    var btn = document.getElementById("btn-copy-survey");
    var text = buildSurveyPrompt();

    function showResult(ok) {
      if (!btn) return;
      btn.textContent = ok ? "복사됨!" : "복사 실패 — 다시 시도";
      setTimeout(function () { if (btn) btn.textContent = "설문 결과 복사 (T0용)"; }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showResult(true); }, function () { showResult(fallbackCopy(text)); });
    } else {
      showResult(fallbackCopy(text));
    }
  }

  function requestT0Generation() {
    var btn = document.getElementById("btn-generate-t0");
    var errBox = document.getElementById("t0-import-error");
    var textarea = document.getElementById("t0-paste");
    if (errBox) errBox.textContent = "";
    if (btn) { btn.disabled = true; btn.textContent = "생성 중..."; }

    fetch(API_BASE_URL + "/api/t0", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ surveyAnswers: state.surveyAnswers }),
    })
      .then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, body: body }; });
      })
      .then(function (r) {
        if (!r.ok) throw new Error(r.body && r.body.error ? r.body.error : "백엔드 요청이 실패했어요.");
        if (textarea) textarea.value = JSON.stringify(r.body, null, 2);
        applyT0Import(r.body.topics);
        render();
      })
      .catch(function (e) {
        if (errBox) errBox.textContent = "생성 요청 실패: " + e.message + " (백엔드가 꺼져 있으면 위 수동 복사/붙여넣기를 이용하세요.)";
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = "생성 요청"; }
      });
  }

  function parseT0Output(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: "JSON 형식을 읽을 수 없어요: " + e.message };
    }
    if (!parsed || !Array.isArray(parsed.topics)) {
      return { error: "'topics' 배열을 찾을 수 없어요. T0가 만든 JSON 전체를 그대로 붙여넣었는지 확인해주세요." };
    }
    if (parsed.topics.length !== 20) {
      return { error: "주제가 20개가 아니라 " + parsed.topics.length + "개예요. T0에게 다시 확인을 요청해주세요." };
    }
    for (var i = 0; i < parsed.topics.length; i++) {
      var t = parsed.topics[i];
      var label = (t && t.name) || (i + 1) + "번째 항목";
      if (!t || typeof t.name !== "string" || !t.name.trim()) {
        return { error: (i + 1) + "번째 주제에 이름(name)이 없어요." };
      }
      if (!Array.isArray(t.questions) || t.questions.length !== 4) {
        return { error: '"' + label + '" 주제의 질문이 4개가 아니에요.' };
      }
    }
    return { topics: parsed.topics };
  }

  var t1GradeState = null;

  function renderT1GradeForm() {
    var topics = (state.schedule && state.schedule.topics) || [];
    var todayEntry = state.schedule && state.schedule.byDate[fmtDate(new Date())];
    var defaultTopic = (todayEntry && todayEntry.newTopics[0]) || topics[0] || "";
    var options = topics.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (t === defaultTopic ? " selected" : "") + ">" + escapeHtml(t) + "</option>";
    }).join("");
    return (
      '<div class="field"><label>주제</label><select id="t1-grade-topic">' + options + "</select></div>" +
      '<div class="field"><label>실제로 답한 질문</label><input type="text" id="t1-grade-question" placeholder="예: Q2. 카페를 얼마나 자주 가나요?"></div>' +
      '<div class="field"><label>스크립트</label><textarea id="t1-grade-script" rows="5" placeholder="말하거나 쓴 답변을 그대로 붙여넣으세요"></textarea></div>' +
      '<div class="field-error" id="t1-grade-error"></div>' +
      '<div class="row-actions" style="margin-top:0;"><span></span><button class="btn btn-primary btn-sm" id="btn-request-t1-grade">채점 요청</button></div>'
    );
  }

  function requestT1Grade() {
    var btn = document.getElementById("btn-request-t1-grade");
    var errEl = document.getElementById("t1-grade-error");
    var topic = document.getElementById("t1-grade-topic").value;
    var question = document.getElementById("t1-grade-question").value.trim();
    var scriptText = document.getElementById("t1-grade-script").value.trim();
    errEl.textContent = "";

    if (!question) { errEl.textContent = "어떤 질문에 답했는지 알려주세요 — 질문 없이는 채점할 수 없어요."; return; }
    if (!scriptText) { errEl.textContent = "스크립트를 입력해주세요."; return; }

    var existing = state.scripts.find(function (s) { return s.topic === topic; });
    var mode = existing ? "review" : "new";

    btn.disabled = true; btn.textContent = "채점 중...";
    fetch(API_BASE_URL + "/api/t1/grade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic: topic, question: question, scriptText: scriptText, mode: mode,
        originalScriptText: existing ? existing.originalScriptText : undefined,
        previousGrade: existing ? existing.grade : undefined,
      }),
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.body && r.body.error ? r.body.error : "채점 요청이 실패했어요.");
        t1GradeState = { topic: topic, originalScriptText: scriptText, result: r.body };
        renderT1GradeResult();
      })
      .catch(function (e) {
        errEl.textContent = "채점 요청 실패: " + e.message + " (백엔드가 꺼져 있으면 아래 수동 붙여넣기를 이용하세요.)";
      })
      .finally(function () {
        btn.disabled = false; btn.textContent = "채점 요청";
      });
  }

  function renderT1GradeResult() {
    var box = document.getElementById("t1-grade-result");
    if (!box) return;
    if (!t1GradeState) { box.innerHTML = ""; return; }
    var r = t1GradeState.result;

    var errorsHtml = (r.errors || []).map(function (e) {
      return "<li><strong>“" + escapeHtml(e.quote) + "”</strong> — " + escapeHtml(e.explanation) + "</li>";
    }).join("");

    var candidatesHtml = (r.candidateExpressions || []).map(function (text, i) {
      return '<label class="expr-check"><input type="checkbox" data-expr-idx="' + i + '"> ' + escapeHtml(text) + "</label>";
    }).join("");

    box.innerHTML =
      '<div class="card" style="margin-top:12px; background:var(--surface-2, #f7f7f8);">' +
      "<div><strong>채점 등급: " + escapeHtml(r.grade) + "</strong></div>" +
      "<p class=\"subtle\" style=\"margin-top:8px;\">" + escapeHtml(r.feedback) + "</p>" +
      (errorsHtml ? "<div class=\"eyebrow\" style=\"margin-top:10px;\">오류 표시</div><ul>" + errorsHtml + "</ul>" : "") +
      '<div class="eyebrow" style="margin-top:10px;">수정된 스크립트</div><p>' + escapeHtml(r.correctedScript) + "</p>" +
      '<div class="eyebrow" style="margin-top:10px;">암기 키워드 흐름</div><p>' + (r.keywordFlow || []).map(escapeHtml).join(" → ") + "</p>" +
      '<div class="eyebrow" style="margin-top:10px;">주요 표현 후보 — 5개를 골라주세요</div>' +
      '<div class="expr-check-list">' + candidatesHtml + "</div>" +
      '<div class="field-error" id="t1-finalize-error"></div>' +
      '<div class="row-actions" style="margin-top:10px;"><span></span><button class="btn btn-primary btn-sm" id="btn-finalize-t1">선택 완료 → 저장</button></div>' +
      "</div>";

    document.getElementById("btn-finalize-t1").addEventListener("click", finalizeT1);
  }

  function finalizeT1() {
    var errEl = document.getElementById("t1-finalize-error");
    var checked = Array.prototype.filter.call(document.querySelectorAll("[data-expr-idx]"), function (el) { return el.checked; });
    var selectedIndices = checked.map(function (el) { return parseInt(el.getAttribute("data-expr-idx"), 10); });
    if (selectedIndices.length === 0) {
      errEl.textContent = "표현을 최소 1개(권장 5개) 골라주세요.";
      return;
    }
    var r = t1GradeState.result;
    fetch(API_BASE_URL + "/api/t1/finalize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        topic: t1GradeState.topic,
        originalScriptText: t1GradeState.originalScriptText,
        correctedScript: r.correctedScript,
        feedback: r.feedback,
        grade: r.grade,
        candidateExpressions: r.candidateExpressions,
        selectedIndices: selectedIndices,
      }),
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.body && result.body.error ? result.body.error : "저장 요청이 실패했어요.");
        applyT1Import(result.body);
        t1GradeState = null;
        render();
      })
      .catch(function (e) { errEl.textContent = "저장 실패: " + e.message; });
  }

  function parseT1Output(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: "JSON 형식을 읽을 수 없어요: " + e.message };
    }
    if (!parsed || typeof parsed.topic !== "string" || !parsed.topic.trim()) {
      return { error: "'topic'이 없어요. T1이 만든 JSON 전체를 그대로 붙여넣었는지 확인해주세요." };
    }
    if (typeof parsed.grade !== "string" || !parsed.grade.trim()) {
      return { error: "'grade'(채점 등급)가 없어요." };
    }
    if (typeof parsed.scriptText !== "string" || !parsed.scriptText.trim()) {
      return { error: "'scriptText'(수정된 스크립트)가 없어요." };
    }
    if (typeof parsed.originalScriptText !== "string" || !parsed.originalScriptText.trim()) {
      return { error: "'originalScriptText'(최초 스크립트 원문)가 없어요 — T2가 나중에 수정량을 계산할 때 필요해요." };
    }
    if (!Array.isArray(parsed.expressions) || parsed.expressions.length === 0) {
      return { error: "'expressions' 배열이 비어있어요." };
    }
    for (var i = 0; i < parsed.expressions.length; i++) {
      var ex = parsed.expressions[i];
      if (!ex || typeof ex.text !== "string" || !ex.text.trim()) {
        return { error: (i + 1) + "번째 표현에 text가 없어요." };
      }
    }
    var importantCount = parsed.expressions.filter(function (ex) { return ex.important; }).length;
    if (importantCount === 0) {
      return { error: "important: true인 표현이 하나도 없어요 — 사용자가 고른 5개를 표시해야 해요." };
    }
    return { data: parsed };
  }

  function applyT1Import(data) {
    var today = fmtDate(new Date());
    var existing = state.scripts.find(function (s) { return s.topic === data.topic; });
    if (existing) {
      existing.grade = data.grade;
      existing.scriptText = data.scriptText;
      existing.originalScriptText = data.originalScriptText;
      existing.feedback = data.feedback || "";
      existing.lastGradedAt = today;
    } else {
      state.scripts.push({
        name: data.topic + " · " + today,
        topic: data.topic,
        masteryPct: 0,
        reviewCount: 0,
        createdAt: today,
        lastGradedAt: today,
        grade: data.grade,
        scriptText: data.scriptText,
        originalScriptText: data.originalScriptText,
        feedback: data.feedback || ""
      });
    }
    // 이번 채점의 표현 10개가 그 스크립트의 "현재" 표현 세트다 — 재채점(복습 모드)
    // 시 이전 회차에만 있던 표현은 여기서 걸러낸다(스크립트가 topic당 1개로
    // 덮어써지는 것과 같은 원칙). 이름이 겹치는 표현은 masteryPct 이력을 보존한다.
    var newTexts = data.expressions.map(function (ex) { return ex.text; });
    state.expressions = state.expressions.filter(function (e) {
      return e.topic !== data.topic || newTexts.indexOf(e.name) !== -1;
    });
    data.expressions.forEach(function (ex) {
      var existingExpr = state.expressions.find(function (e) { return e.topic === data.topic && e.name === ex.text; });
      if (existingExpr) {
        existingExpr.important = existingExpr.important || !!ex.important;
      } else {
        state.expressions.push({
          name: ex.text,
          topic: data.topic,
          masteryPct: 0,
          createdAt: today,
          important: !!ex.important
        });
      }
    });
    var cur = state.progressBoard[data.topic] || 0;
    state.progressBoard[data.topic] = Math.max(cur, 2);
    save();
  }

  var VALID_PCT = [0, 25, 50, 75, 100];

  function parseReviewOutput(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: "JSON 형식을 읽을 수 없어요: " + e.message };
    }
    if (!parsed || typeof parsed.topic !== "string" || !parsed.topic.trim()) {
      return { error: "'topic'이 없어요. T2가 만든 JSON 전체를 그대로 붙여넣었는지 확인해주세요." };
    }
    if (typeof parsed.masteryPct !== "number" || VALID_PCT.indexOf(parsed.masteryPct) === -1) {
      return { error: "'masteryPct'는 0/25/50/75/100 중 하나여야 해요." };
    }
    var script = state.scripts.find(function (s) { return s.topic === parsed.topic; });
    if (!script) {
      return { error: '"' + parsed.topic + '" 주제의 저장된 스크립트를 찾을 수 없어요 — 먼저 T1으로 채점을 마쳐야 해요.' };
    }
    if (parsed.expressionResults !== undefined) {
      if (!Array.isArray(parsed.expressionResults)) {
        return { error: "'expressionResults'는 배열이어야 해요." };
      }
      for (var i = 0; i < parsed.expressionResults.length; i++) {
        var r = parsed.expressionResults[i];
        if (!r || typeof r.text !== "string" || !r.text.trim()) {
          return { error: (i + 1) + "번째 표현 결과에 'text'가 없어요." };
        }
        if (typeof r.masteryPct !== "number" || VALID_PCT.indexOf(r.masteryPct) === -1) {
          return { error: '"' + r.text + '" 표현의 masteryPct는 0/25/50/75/100 중 하나여야 해요.' };
        }
      }
    }
    if (parsed.avgExpressionMastery !== undefined && VALID_PCT.indexOf(parsed.avgExpressionMastery) === -1) {
      return { error: "'avgExpressionMastery'는 0/25/50/75/100 중 하나여야 해요." };
    }
    return { data: parsed };
  }

  function applyReviewImport(data) {
    var script = state.scripts.find(function (s) { return s.topic === data.topic; });
    script.masteryPct = data.masteryPct;
    script.reviewCount = (script.reviewCount || 0) + 1;
    script.lastReviewedAt = fmtDate(new Date());
    script.lastReviewNote = data.note || "";
    if (Array.isArray(data.expressionResults)) {
      var today = fmtDate(new Date());
      data.expressionResults.forEach(function (r) {
        var expr = state.expressions.find(function (e) { return e.topic === data.topic && e.name === r.text; });
        if (!expr) return;
        expr.masteryPct = r.masteryPct;
        expr.lastTestedAt = today;
      });
    }
    if (typeof data.avgExpressionMastery === "number") {
      script.exprAvgMasteryPct = data.avgExpressionMastery;
    }
    save();
  }

  var VALID_DECISIONS = ["weekend_makeup", "push_deadline"];

  function parseT6Output(text) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { error: "JSON 형식을 읽을 수 없어요: " + e.message };
    }
    if (!parsed || typeof parsed.date !== "string" || !parsed.date.trim()) {
      return { error: "'date'가 없어요. T6가 만든 JSON 전체를 그대로 붙여넣었는지 확인해주세요." };
    }
    if (typeof parsed.completedNewScript !== "boolean") {
      return { error: "'completedNewScript'는 true/false여야 해요." };
    }
    if (!parsed.completedNewScript) {
      if (VALID_DECISIONS.indexOf(parsed.decision) === -1) {
        return { error: "'decision'은 'weekend_makeup' 또는 'push_deadline' 중 하나여야 해요(미달성일 때는 null일 수 없어요)." };
      }
    }
    return { data: parsed };
  }

  function applyT6Import(data) {
    var entry = {
      date: data.date,
      studyMinutes: typeof data.studyMinutes === "number" ? data.studyMinutes : null,
      completedNewScript: data.completedNewScript,
      achievementNote: data.achievementNote || "",
      goodPoints: data.goodPoints || "",
      improvements: data.improvements || "",
      decision: data.decision || null
    };
    var existing = state.logs.find(function (l) { return l.date === data.date; });
    if (existing) {
      for (var k in entry) existing[k] = entry[k];
    } else {
      state.logs.push(entry);
    }
    if (data.decision === "weekend_makeup") {
      state.schedule = extendScheduleByWeekendMakeup(state.schedule, data.date);
    } else if (data.decision === "push_deadline") {
      state.schedule = extendScheduleByPushingDeadline(state.schedule, data.date);
    }
    save();
  }

  function buildRetroPrompt() {
    var todayStr = fmtDate(new Date());
    var todayEntry = state.schedule.byDate[todayStr];
    var hasNew = todayEntry && todayEntry.newTopics && todayEntry.newTopics.length;
    var lines = ["[OPIC 어시스턴트] 오늘의 회고 — " + todayStr, ""];
    if (hasNew) {
      lines.push("오늘 배정된 신규 학습 주제: " + todayEntry.newTopics.join(", "));
    } else {
      lines.push("오늘 배정된 신규 학습 주제: 없음");
    }
    lines.push("");

  function fallbackCopy(text) {
    var ok = false;
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    return ok;
  }

  function buildReviewPrompt(topic) {
    var script = state.scripts.find(function (s) { return s.topic === topic; });
    var lines = ["[OPIC 어시스턴트] 복습 정보 — " + topic, ""];
    if (!script) {
      lines.push("이 주제의 저장된 스크립트를 찾을 수 없어요 — T1으로 먼저 채점을 마쳐야 복습 정보가 쌓입니다.");
      return lines.join("\n");
    }
    lines.push("직전 채점 등급: " + script.grade);
    lines.push("");
    lines.push("최초 스크립트:");
    lines.push(script.originalScriptText || "(기록 없음)");
    lines.push("");
    lines.push("수정된 스크립트:");
    lines.push(script.scriptText);
    lines.push("");
    var importantExprs = state.expressions.filter(function (e) { return e.topic === topic && e.important; });
    lines.push("주요 표현 " + importantExprs.length + "개:");
    importantExprs.forEach(function (e, i) { lines.push((i + 1) + ". " + e.name); });
    lines.push("");
    lines.push("(위 정보와 함께, 오늘 다시 말해본 스크립트를 전사해서 붙여넣어줘. T2가 체화 정도를 계산한 뒤 위 주요 표현들을 이어서 테스트하고, 틀린 건 재도전까지 시켜서 표현 평균까지 한 번에 내줄 거야. 끝나면 나오는 JSON 하나만 대시보드에 붙여넣으면 돼. 복습 모드로 T1 채점도 같이 받고 싶으면 그것도 요청해도 돼.)");
    return lines.join("\n");
  }

  function copyReviewPrompt(topic, btn) {
    var text = buildReviewPrompt(topic);
    var originalLabel = btn ? btn.textContent : "";

    function showResult(ok) {
      if (!btn) return;
      btn.textContent = ok ? "복사됨!" : "복사 실패 — 다시 시도";
      setTimeout(function () { if (btn) btn.textContent = originalLabel; }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showResult(true); }, function () { showResult(fallbackCopy(text)); });
    } else {
      showResult(fallbackCopy(text));
    }
  }

    var filtered = items.filter(function (it) {
      if (filterTopic && it.topic !== filterTopic) return false;
      if (filterPct !== "" && String(it.masteryPct) !== filterPct) return false;
      return true;
    });

    var title = kind === "scripts" ? "3-1 · 전체 스크립트 보기" : "3-2 · 전체 표현 보기";
    var isScripts = kind === "scripts";
    var rows = filtered.map(function (it) {
      var exprAvgCell = isScripts ? '<td class="tabular">' + (it.exprAvgMasteryPct != null ? it.exprAvgMasteryPct + "%" : "—") + "</td>" : "";
      return "<tr><td>" + escapeHtml(it.name || "") + "</td><td>" + escapeHtml(it.topic || "") + '</td><td class="tabular">' + (it.masteryPct != null ? it.masteryPct + "%" : "—") + "</td>" + exprAvgCell + "<td>" + (it.createdAt || "") + "</td></tr>";
    }).join("");

    app.innerHTML = navBar(kind) +
      '<div class="card">' +
      '<div class="eyebrow">' + title + '</div>' +
      '<h1 class="title-lg">' + (kind === "scripts" ? "대본" : "표현") + " (열람 전용)</h1>" +
      '<div class="filter-bar">' +
      '<select id="filt-topic"><option value="">전체 주제</option>' + topics.map(function (t) { return '<option value="' + escapeHtml(t) + '" ' + (filterTopic === t ? "selected" : "") + ">" + escapeHtml(t) + "</option>"; }).join("") + "</select>" +
      '<select id="filt-pct"><option value="">전체 체화 정도</option>' + VALID_PCT.map(function (p) { return '<option value="' + p + '" ' + (filterPct === String(p) ? "selected" : "") + ">" + p + "%</option>"; }).join("") + "</select>" +
      "</div>" +
      (filtered.length
        ? '<table class="db"><thead><tr><th>이름</th><th>주제</th><th>체화 정도</th>' + (isScripts ? "<th>표현 평균 체화도</th>" : "") + "<th>작성일</th></tr></thead><tbody>" + rows + "</tbody></table>"
        : '<div class="empty-note">아직 데이터가 없습니다. Claude와의 대화(T1~T7)에서 스크립트/표현을 만들면 여기 쌓입니다.</div>') +
      "</div>";

    bindNav();
    document.getElementById("filt-topic").addEventListener("change", function (e) {
      state["_filterTopic_" + kind] = e.target.value; render();
    });
    document.getElementById("filt-pct").addEventListener("change", function (e) {
      state["_filterPct_" + kind] = e.target.value; render();
    });
  }

  render();
})();
</script>
